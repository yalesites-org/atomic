name: atomic
type: theme
description: YaleSites starter theme using Storybook and component-driven development
base theme: stable9
core_version_requirement: ^9 || ^10 || ^11

# Optional module integration - deliberately NOT a hard `dependencies:` entry.
#
# atomic_preprocess_node() enriches Resource nodes via two ys_layouts services:
# `ys_layouts.resource_author_builder` (author byline) and
# `ys_layouts.media_alt_resolver` (cover-image alt text). Both call sites are
# guarded with \Drupal::hasService(). Without the module the alt falls back to
# the media label (exactly what this call site did before the resolver
# existed) and the author list is empty, so resource templates omit the byline
# the same way they do for a resource with no authors. A real dependency would
# make core refuse to install the theme without ys_layouts, defeating atomic's
# use as a standalone starter theme - hence a note rather than a key.

libraries:
  - atomic/global
  - atomic/layout-builder
  - atomic/fontawesome
  - atomic/disable-menu

ckeditor5-stylesheets:
  - css/ckeditor5.css

regions:
  header: Header
  system: System
  content: Content
  footer: Footer

logo: images/logo.png

components:
  namespaces:
    tokens:
      - node_modules/@yalesites-org/component-library-twig/components/00-tokens
    atoms:
      - node_modules/@yalesites-org/component-library-twig/components/01-atoms
    molecules:
      - node_modules/@yalesites-org/component-library-twig/components/02-molecules
    organisms:
      - node_modules/@yalesites-org/component-library-twig/components/03-organisms
    page-layouts:
      - node_modules/@yalesites-org/component-library-twig/components/04-page-layouts
