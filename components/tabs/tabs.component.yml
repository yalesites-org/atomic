$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tabs
status: stable
group: Molecules
description: >
  A tabbed interface (tablist + tabpanels) with JavaScript behavior. Thin SDC
  wrapper over @molecules/tabs/yds-tabs.twig; JS via libraryOverrides
  (atomic/tabs). The consumer builds the label/content slots and shares tabs__id
  with this component so the labels' aria-controls link to the panels' ids.
libraryOverrides:
  dependencies:
    - atomic/tabs
props:
  type: object
  properties:
    tabs__id:
      title: Tabs id
      description: >
        A unique id shared between the label and content slots (links each tab's
        aria-controls/href to its panel id). Generated by the consumer.
      type:
        - string
        - number
    tabs__theme:
      title: Theme
      type: string
      default: one
slots:
  tab__label_slot:
    title: Tab labels
    required: true
    description: The <li> tab labels (built by the consumer with the shared tabs__id).
  tab__content_slot:
    title: Tab panels
    required: true
    description: The tabpanel containers (built by the consumer with the shared tabs__id).
