calendar:
  js:
    # A real ES module, unlike every other component script here: the calendar and
    # the modal both import micromodal, and Rollup hoists a module shared by two
    # entries out into dist/assets/. Loaded as a classic script, its top-level
    # `import` is a parse-time SyntaxError, so nothing runs and
    # Drupal.behaviors.eventsCalendar never registers -- an inert calendar.
    # `type: module` makes the import legal (still executes before
    # DOMContentLoaded, so behaviours register in time); `preprocess: false` keeps
    # aggregation from concatenating a module into a classic bundle.
    # component-library-twig's scripts/dist-module-format.test.mjs fails if this set
    # of ES modules changes, and carries the full rationale.
    node_modules/@yalesites-org/component-library-twig/dist/js/components/03-organisms/calendar/yds-calendar.js:
      attributes:
        type: module
      preprocess: false
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - core/once
audio-player:
